<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Masuk &amp; Registrasi — CRM Warmindo Adzkiya</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/modules/login.css">
</head>
<body class="auth-body">

  <div class="auth-container">
    <div class="auth-header">
      <div class="auth-logo">
        <svg class="icon icon-lg" viewBox="0 0 24 24"><path d="M6 13.87A4 4 0 0 1 7.41 6a5.11 5.11 0 0 1 1.05-1.54 5 5 0 0 1 7.08 0A5.11 5.11 0 0 1 16.59 6 4 4 0 0 1 18 13.87V21H6Z"/><line x1="6" y1="17" x2="18" y2="17"/></svg>
      </div>
      <h1 class="auth-title">CRM Warmindo Adzkiya</h1>
      <p class="auth-desc" id="auth-subtitle">Masuk ke Sistem Operasional &amp; Dapur</p>
    </div>

    <!-- Mode Toggle: Masuk vs Daftar Pembeli -->
    <div class="auth-tabs" role="tablist">
      <button type="button" class="auth-tab-btn active" id="tab-btn-login" role="tab">
        <svg class="icon icon-sm" viewBox="0 0 24 24"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
        Masuk Akun
      </button>
      <button type="button" class="auth-tab-btn" id="tab-btn-register" role="tab">
        <svg class="icon icon-sm" viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" y1="8" x2="19" y2="14"/><line x1="22" y1="11" x2="16" y2="11"/></svg>
        Daftar Pembeli Baru
      </button>
    </div>

    <div id="msg-box" class="msg-banner"></div>

    <!-- FORM 1: LOGIN -->
    <form id="login-form">
      <div class="form-group">
        <label for="username">Nama Pengguna (Username)</label>
        <input id="username" name="username" type="text" required placeholder="Contoh: admin, koki, atau pembeli" autocomplete="username">
      </div>

      <div class="form-group">
        <label for="password">Kata Sandi (Password)</label>
        <input id="password" name="password" type="password" required placeholder="Masukkan kata sandi" autocomplete="current-password">
      </div>

      <button type="submit" class="btn btn-submit" id="btn-login-submit">
        <svg class="icon icon-sm" viewBox="0 0 24 24"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
        Masuk ke Sistem
      </button>
    </form>

    <!-- FORM 2: REGISTER PEMBELI -->
    <form id="register-form" style="display: none;">
      <div class="form-group">
        <label for="reg-nama">Nama Lengkap Anda</label>
        <input id="reg-nama" name="regNama" type="text" required placeholder="Contoh: Rafi Ahmad" autocomplete="name">
      </div>

      <div class="form-group">
        <label for="reg-wa">Nomor WhatsApp Aktif</label>
        <input id="reg-wa" name="regWa" type="tel" required placeholder="Contoh: 081234567890" autocomplete="tel">
      </div>

      <div class="form-group">
        <label for="reg-username">Username Pilihan</label>
        <input id="reg-username" name="regUsername" type="text" required placeholder="Gunakan huruf kecil tanpa spasi" autocomplete="username">
      </div>

      <div class="form-group">
        <label for="reg-password">Kata Sandi Baru</label>
        <input id="reg-password" name="regPassword" type="password" required placeholder="Minimal 4 karakter" autocomplete="new-password">
      </div>

      <button type="submit" class="btn btn-submit" id="btn-register-submit">
        <svg class="icon icon-sm" viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><polyline points="16 11 18 13 22 9"/></svg>
        Daftar &amp; Masuk ke Warung
      </button>
    </form>

    <!-- Quick Demo Access (For Evaluators) -->
    <div class="quick-login-wrap">
      <div class="quick-login-title">Akses Uji Coba Cepat (Demo):</div>
      <div class="quick-login-grid">
        <button type="button" class="btn g s" data-u="admin" data-p="admin123" title="Login sebagai Administrator (Full Access CRM UTS 3a)">
          <svg class="icon icon-sm" viewBox="0 0 24 24"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
          Admin
        </button>
        <button type="button" class="btn g s" data-u="pemilik" data-p="pemilik123" title="Login sebagai Pemilik (Omset &amp; SLA Dashboard)">
          <svg class="icon icon-sm" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18"/><path d="M9 21V9"/></svg>
          Pemilik
        </button>
        <button type="button" class="btn g s" data-u="koki" data-p="koki123" title="Login sebagai Koki (Kitchen Display Board KDS)">
          <svg class="icon icon-sm" viewBox="0 0 24 24"><path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2"/><path d="M7 2v20"/></svg>
          Koki
        </button>
        <button type="button" class="btn g s" data-u="pembeli" data-p="pembeli123" title="Login sebagai Pembeli (Pesan Menu &amp; Status Meja)">
          <svg class="icon icon-sm" viewBox="0 0 24 24"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/></svg>
          Pembeli
        </button>
      </div>
    </div>
  </div>

  <script src="/js/login.js"></script>
</body>
</html>
