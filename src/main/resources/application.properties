spring.application.name=adzkiya-crm
server.port=8080

# Database MySQL Configuration (Laragon / XAMPP default)
spring.datasource.url=jdbc:mysql://localhost:3306/crm_adzkiya?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Jakarta
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Static resources mapping
spring.web.resources.static-locations=classpath:/static/

# Session Management
server.servlet.session.timeout=120m
server.servlet.session.cookie.name=ADZKIYA_SESSION
